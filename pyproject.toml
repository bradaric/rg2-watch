[project]
name = "rg2watch"
version = "0.1.0"
description = "Watches the RIK website for newly published polling-station documents"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15.0",
    "httpx",
    "pillow>=13.0.0",
    "pypdfium2>=5.14.0",
]

[project.scripts]
rg2watch = "rg2watch.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rg2watch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["live_api: sends a real API request (needs RG2W_LIVE_API=1)", "real_osd: runs real tesseract OSD", "slow: large-scale scenarios (still run by default; deselect with -m 'not slow')"]
