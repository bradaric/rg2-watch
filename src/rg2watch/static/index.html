<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rg2-watch</title>
<link rel="stylesheet" href="dataTables.dataTables.min.css">
<style>
:root{color-scheme:light dark;--bg:#fff;--fg:#1b1f24;--mut:#667;--line:#d8dce1;--card:#f5f6f8;--hi:#c62828;--md:#e08600;--lo:#2e7d32;--link:#0b5fc0}
@media (prefers-color-scheme:dark){:root{--bg:#14171a;--fg:#e4e7ea;--mut:#98a;--line:#2d3238;--card:#1d2125;--hi:#ef5350;--md:#ffb74d;--lo:#81c784;--link:#7ab6ff}}
*{box-sizing:border-box}
body{margin:0;padding:12px 16px;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,sans-serif}
a{color:var(--link)}
h1{font-size:18px;margin:0 0 8px}
h3{font-size:13px;margin:0 0 4px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
#banner{display:none;margin:0 0 8px;padding:8px 12px;border-radius:4px;background:var(--hi);color:#fff;font-weight:600}
#status{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px;margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:6px 10px}
.card dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:1px 10px}
.card dt{color:var(--mut)}.card dd{margin:0;overflow-wrap:anywhere}
.card.wide{grid-column:1/-1}
.card table{width:100%;border-collapse:collapse}
.card td{padding:1px 6px;border:0;vertical-align:top}
.bad{color:var(--hi);font-weight:600}.warn{color:var(--md);font-weight:600}.good{color:var(--lo)}
#ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
#ctl label{white-space:nowrap}
input,select,button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:3px 6px}
#rulesbox,#colbox{position:relative}
#rulesbox summary,#colbox summary{cursor:pointer;padding:3px 6px;border:1px solid var(--line);border-radius:4px;background:var(--card);list-style:none;white-space:nowrap}
#rulesbox[open] summary,#colbox[open] summary{border-color:var(--link)}
#rules,#cols{position:absolute;z-index:5;top:100%;left:0;margin-top:2px;padding:6px 8px;background:var(--card);border:1px solid var(--line);border-radius:4px;max-height:16em;overflow:auto;display:grid;grid-template-columns:repeat(3,auto);gap:2px 14px;box-shadow:0 4px 12px rgba(0,0,0,.25)}
#rules label,#cols label{white-space:nowrap}
#wrap{overflow-x:auto}
table.dataTable>tbody>tr>*{box-shadow:none!important;background:var(--bg)!important;color:var(--fg);vertical-align:top}
table.dataTable>thead>tr>*{color:var(--fg);white-space:nowrap}
#forms th,#forms td{text-align:left!important}
table.dataTable td.dt-right,table.dataTable th.dt-right{text-align:right}
table.dataTable td.scol{min-width:11em}
table.dataTable td.nw{white-space:nowrap}
table.dataTable td.fcol{min-width:28em;width:42%;white-space:normal;overflow-wrap:anywhere}
table.dataTable th.dt-orderable-none .dt-column-order{display:none}
#hero{border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin-bottom:12px;background:var(--card)}
#herobar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
#herotitle{font-size:clamp(1.2rem,2.2vw,2.4rem);font-weight:600;overflow-wrap:anywhere}
#heronums{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:10px 0}
.tile{padding:8px 12px;border-radius:6px;background:var(--bg);border:1px solid var(--line)}
.tile .k,.tile .s,#herofoot{color:var(--mut);font-size:clamp(.8rem,1.1vw,1.3rem)}
.tile .v{font-size:clamp(2rem,4.6vw,5.5rem);font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.prog{height:.7em;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px}
.prog>div{height:100%;width:0;background:#0072B2;transition:width .8s ease}
#herochart{margin:8px 0}
.hrow{display:grid;grid-template-columns:minmax(7em,17%) 1fr minmax(10em,24%);gap:10px;align-items:center;margin:6px 0;font-size:clamp(1rem,1.9vw,2.2rem)}
.hrow[hidden]{display:none}
.hrow .track{background:var(--line);border-radius:4px;height:1.4em;overflow:hidden}
.hrow .fill{height:100%;width:0;min-width:2px;border-radius:4px;transition:width .8s ease,background-color .3s}
.hrow .val{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.hrow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#heronote{font-size:clamp(1rem,1.6vw,1.8rem);font-weight:600;color:var(--md);margin:6px 0}
#herofoot .stale{color:var(--hi);font-weight:600}
@keyframes flash{from{background:rgba(230,159,0,.5)}to{background:transparent}}
.flash{animation:flash 1.2s}
body.hero>*:not(#resview){display:none!important}
body.hero #resview>*:not(#hero){display:none}
body.hero{padding:10px 2vw}
body.hero #hero{border:0;background:transparent}
@media (max-width:700px){.hrow{grid-template-columns:1fr auto;grid-template-areas:"nm val" "tr tr"}.hrow .nm{grid-area:nm}.hrow .val{grid-area:val}.hrow .track{grid-area:tr}}
@media (prefers-reduced-motion:reduce){.prog>div,.hrow .fill{transition:none}.flash{animation:none}}
#texcl td button{white-space:nowrap}
.warnbox{margin:0 0 8px;padding:6px 10px;border:2px solid var(--md);border-radius:4px;font-weight:600}
#tabs{display:flex;gap:6px;margin:0 0 8px}
#tabs button.on{border-color:var(--link);font-weight:600}
#toverall{overflow-x:auto;margin-bottom:10px}
#toverall table{border-collapse:collapse}
#toverall th,#toverall td{padding:4px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
#toverall th:first-child,#toverall td:first-child{text-align:left}
#resview h3{margin-top:14px}
.note{display:block;color:var(--mut);font-size:12px}
@media (max-width:700px){body{padding:8px}#status{grid-template-columns:1fr}table.dataTable td.fcol{min-width:16em}#rules,#cols{grid-template-columns:repeat(2,auto)}}
table.dataTable>tbody>tr.child>td{background:var(--card)!important}
.dt-container{color:var(--fg)}
.dt-container select,.dt-container input{background:var(--card)}
.b{display:inline-block;padding:0 6px;border-radius:8px;color:#fff;font-size:12px;margin-right:4px}
.b.HIGH{background:var(--hi)}.b.MEDIUM{background:var(--md)}.b.LOW{background:var(--lo)}
.b.dis{outline:2px solid var(--hi);outline-offset:1px}
.mut{color:var(--mut)}
.f{margin:2px 0}
td.disagree{color:var(--hi);font-weight:600}
.sub{margin:3px 0 3px 24px}
</style></head><body>
<h1>rg2-watch <span class="mut" id="built"></span></h1>
<div id="banner"></div>
<div id="status"></div>
<div id="tabs"><button id="tabforms" class="on">Forms</button><button id="tabres">Results (unofficial)</button></div>
<div id="formsview">
<div id="ctl">
<input id="q" type="search" placeholder="search">
<select id="m"></select><select id="e"></select><select id="mod"></select>
<label>min severity <select id="sev"><option value="0">any</option><option value="1">LOW</option><option value="2">MEDIUM</option><option value="3">HIGH</option></select></label>
<details id="rulesbox"><summary id="rulessum">rules: any</summary><div id="rules"></div></details>
<label><input type="checkbox" id="fl"> with findings</label>
<label><input type="checkbox" id="rp"> replaced</label>
<label><input type="checkbox" id="rm"> removed</label>
<label><input type="checkbox" id="fa"> analysis failed</label>
<label><input type="checkbox" id="loc"> has local copy</label>
<label><input type="checkbox" id="dis"> models disagree</label>
<details id="colbox"><summary>columns</summary><div id="cols"></div></details>
<label><input type="checkbox" id="auto" checked> auto-refresh</label>
</div>
<div id="onlyid" class="warnbox" hidden><span id="onlytxt"></span> <button id="onlyclear">show all forms</button></div>
<div id="wrap"><table id="forms" class="display" style="width:100%"></table></div>
</div>
<div id="resview" hidden>
<section id="hero">
<div id="herobar"><select id="hmuni" aria-label="municipality"></select>
<select id="hmode" aria-label="forms counted"><option value="cl">clean forms only</option><option value="all">all counted forms</option></select>
<button id="herobtn">Presentation mode</button></div>
<div id="herotitle"></div>
<div id="heronums">
<div class="tile"><div class="k">Turnout</div><div class="v" id="hv-turn">-</div><div class="s" id="hs-turn"></div></div>
<div class="tile"><div class="k">Stations counted</div><div class="v" id="hv-st">-</div><div class="prog"><div id="hp-st"></div></div><div class="s" id="hs-st"></div></div>
<div class="tile"><div class="k">Forms</div><div class="v" id="hv-forms">-</div><div class="s">clean / excluded</div></div>
<div class="tile"><div class="k">Valid votes</div><div class="v" id="hv-valid">-</div><div class="s" id="hs-valid"></div></div>
</div>
<div id="heronames" class="warnbox" hidden></div>
<div id="heronote"></div>
<div id="herochart"></div>
<div id="herofoot"></div>
</section>
<p class="warnbox">Unofficial - numbers read by a model from the scanned forms. <span id="tmeta"></span></p>
<div id="tctl"><label>totals over <select id="tmode"><option value="cl">clean forms only</option><option value="all">all counted forms</option></select></label>
<button id="csv">Download CSV</button></div>
<h3>Overall</h3><div id="toverall"></div>
<h3>Per municipality</h3><div class="wrapx" style="overflow-x:auto"><table id="tmunis" class="display" style="width:100%"></table></div>
<h3>Excluded forms</h3><div class="wrapx" style="overflow-x:auto"><table id="texcl" class="display" style="width:100%"></table></div>
<h3 id="tnoteshead" hidden>Notes (not excluded)</h3><ul id="tnotes"></ul>
</div>
<script src="jquery.min.js"></script>
<script src="dataTables.min.js"></script>
<script>
"use strict";
// All data reaches the DOM through DataTable.render.text() / escapeHtml, textContent or DOM
// construction: never innerHTML with data.
const $ = id => document.getElementById(id);
const HTTP = /^https?:$/.test(location.protocol);
const esc = DataTable.util.escapeHtml;
const TZ = "Europe/Belgrade";
const SEV = ["", "LOW", "MEDIUM", "HIGH"];
const STATUS_EVERY_MS = 10000, STALE_S = 60;
const pad = n => String(n).padStart(2, "0");
// Serbian local time, DD/MM/YYYY HH:MM, from "YYYY-MM-DDTHH:MM..." (already Serbian local)
function when(s) {
  const m = /^(\d{4})-(\d\d)-(\d\d)[T ](\d\d):(\d\d)/.exec(s || "");
  return m ? m[3] + "/" + m[2] + "/" + m[1] + " " + m[4] + ":" + m[5] : s || "";
}
const fmtEpoch = new Intl.DateTimeFormat("en-GB", {timeZone: TZ, day: "2-digit", month: "2-digit",
  year: "numeric", hour: "2-digit", minute: "2-digit", hourCycle: "h23"});
function epoch(t) {
  if (t == null) return "-";
  const p = Object.fromEntries(fmtEpoch.formatToParts(new Date(t * 1000)).map(x => [x.type, x.value]));
  return p.day + "/" + p.month + "/" + p.year + " " + p.hour + ":" + p.minute;
}
function dur(s) {
  if (s == null) return "-";
  s = Math.round(s);
  return s < 90 ? s + " s" : s < 5400 ? Math.round(s / 60) + " min" : Math.floor(s / 3600) + " h " + pad(Math.round(s % 3600 / 60)) + " min";
}
const ago = t => t == null ? "-" : dur(Date.now() / 1000 - t) + " ago";
function mk(tag, text, cls) {
  const e = document.createElement(tag);
  if (text != null) e.textContent = text;
  if (cls) e.className = cls;
  return e;
}
function link(text, href) {
  const a = mk("a", text);
  a.href = href; a.target = "_blank"; a.rel = "noopener noreferrer";
  return a;
}
const HEX = /^[0-9a-f]{64}$/;
const localHref = h => HEX.test(h || "") ? "pdfs/" + h + ".pdf" : null;
const rikHref = u => /^https?:\/\//i.test(u || "") ? u : null;

// ---- status panel -------------------------------------------------------------------------
let S = null;
function card(title, pairs, cls) {
  const c = mk("div", null, "card" + (cls ? " " + cls : ""));
  c.append(mk("h3", title));
  const dl = mk("dl");
  for (const [k, v, c2] of pairs) dl.append(mk("dt", k), mk("dd", v, c2));
  c.append(dl);
  return c;
}
function renderStatus() {
  const box = $("status"), ban = $("banner");
  if (!S) { box.replaceChildren(); ban.style.display = "block"; ban.textContent = "no status yet"; return; }
  const age = Date.now() / 1000 - S.ts;
  const down = !S.watching || age > STALE_S;
  ban.style.display = down ? "block" : "none";
  ban.textContent = !S.watching ? "watcher not running (status written " + epoch(S.ts) + ")"
    : "watcher not running / stalled since " + epoch(S.ts).slice(-5);
  const w = S.watcher, d = S.docs, a = S.analysis, cards = [];
  if (w) {
    const h = w.health === "blind" ? "blind since " + epoch(w.last_ok) : w.health === "blocked" ? "blocked, paused until " + epoch(w.paused_until) : w.health;
    cards.push(card("Watcher", [
      ["running since", epoch(w.started)], ["last tick", ago(w.last_tick)], ["last RIK request ok", ago(w.last_ok)],
      ["RIK health", h, w.health === "ok" ? "good" : w.health === "slow" ? "warn" : "bad"],
      ["rate", w.rps + " / " + w.max_rps + " req/s"], ["requests this tick", w.tick_used + " / " + w.tick_budget],
      ["lanes", Object.entries(w.lanes).map(([k, v]) => k + " " + ago(v)).join(", ")],
      ["municipalities", w.only ? w.only.join(", ") : "all"]]));
  }
  cards.push(card("Documents", [
    ["RG-2 seen", d.rg2_seen + " of " + (d.stations || "?") + " stations" + (d.rg2_rik != null ? " (RIK lists " + d.rg2_rik + ")" : "")],
    ["new, last 10 / 60 min", d.new10 + " / " + d.new60], ["replaced", d.replaced], ["removed", d.removed],
    ["rare types", Object.entries(d.rare).map(([k, v]) => k + ": " + v).join(", ") || "none"]]));
  const p = a.paused;
  cards.push(card("Analysis", a.on ? [
    ["model", a.model], ["queued / running", a.queued + " / " + a.running],
    ["done / failed / retrying", a.done + " / " + a.failed + " / " + a.retrying],
    ["state", p ? "paused: " + p[0] + (p[1] ? " since " + epoch(p[1]) : "") : "running", p ? "bad" : "good"],
    ["spend", "$" + a.spend.toFixed(2) + " of $" + a.cap.toFixed(2)],
    ["avg per form", a.avg_s == null ? "-" : a.avg_s + " s"], ["time to clear queue", dur(a.eta_s)]]
    : [["state", "off"], ["done / failed", a.done + " / " + a.failed], ["spend", "$" + a.spend.toFixed(2)]]));
  const n = S.ntfy;
  cards.push(card("Alerts", n ? [["ntfy", !n.enabled ? "not configured (terminal only)" : n.failing ? "failing, last ok " + ago(n.last_ok) : "delivering, last ok " + ago(n.last_ok), n.failing ? "bad" : ""],
    ["waiting to send", n.queued]] : [["ntfy", "-"]]));
  const al = mk("div", null, "card wide");
  al.append(mk("h3", "Last " + S.alerts.length + " alerts"));
  const t = mk("table");
  for (const x of S.alerts) {
    const tr = mk("tr"), sv = mk("td");
    sv.append(mk("span", x[1], "b " + (SEV.includes(x[1]) ? x[1] : "")));
    tr.append(mk("td", when(x[0]), "mut"), sv, mk("td", x[2]), mk("td", x[3] + (x[4] ? " BM " + x[4] : "")), mk("td", x[5]), mk("td", x[6] ? "sent" : "", "mut"));
    t.append(tr);
  }
  al.append(t);
  cards.push(al);
  box.replaceChildren(...cards);
  if (typeof renderHero === "function" && slots.length) renderHero();
}

// ---- table --------------------------------------------------------------------------------
let onlyId = null, T = null, tmTable = null, teTable = null;
let D = {rows: [], elections: {}, built: "", interval: 0}, table = null, rows = [];
const FILTERS = ["q", "m", "e", "mod", "sev", "fl", "rp", "rm", "fa", "loc", "dis", "auto"];

function badges(list, dis) {
  const td = document.createDocumentFragment();
  for (const f of list) {
    const d = mk("div", null, "f");
    d.append(mk("span", f[1], "b " + (SEV.includes(f[1]) ? f[1] : "") + (dis && dis.includes(f[0]) && f[1] === "HIGH" ? " dis" : "")), f[0] + ": " + f[2]);
    td.append(d);
  }
  return td;
}
function linksOf(v) {
  const sp = mk("span"), l = localHref(v.pdf), r = rikHref(v.rik);
  if (l) sp.append(link("Local PDF", l), " ");
  if (r) sp.append(link("RIK", r));
  return sp;
}
function child(r) {
  const box = mk("div");
  for (const o of r.ops) {
    const d = mk("div", null, "sub");
    d.append(mk("strong", o.m), mk("span", " (" + when(o.at) + ") ", "mut"), o.f.length ? badges(o.f, r.dis) : mk("span", "no findings", "mut"));
    box.append(d);
  }
  for (const v of r.v) {
    const d = mk("div", null, "sub mut");
    d.append("older version: uploaded " + when(v.up) + ", first seen " + when(v.seen) + ", analysis " + v.ast + " ", linksOf(v));
    d.append(badges(v.f));
    for (const o of v.ops) d.append(mk("div", o.m + ": " + (o.f.map(f => f[0] + " " + f[1]).join(", ") || "no findings"), "sub"));
    box.append(d);
  }
  return box;
}
function prep(r) {
  const all = [r, ...r.v];
  // severity, rules and "with findings" look at the form, its older versions and every model's opinion
  const top = fs => Math.max(0, ...fs.map(f => SEV.indexOf(f[1])));
  const own = top(r.f), olderSev = top(r.v.flatMap(x => x.f)), opSev = top(all.flatMap(x => x.ops.flatMap(o => o.f)));
  r._sev = Math.max(own, olderSev, opSev);
  r.sev = r._sev;
  r._note = r._sev > own ? SEV[r._sev] + " only in " + [olderSev > own ? "older version" : "", opSev > own ? "model analysis" : ""].filter(Boolean).join(" and ") : "";
  const ofs = all.flatMap(x => [...x.f, ...x.ops.flatMap(o => o.f)]);
  r._fl = ofs.length > 0;
  r._rules = new Set(ofs.map(f => f[0]));
  r._models = new Set(all.flatMap(x => x.ops.map(o => o.m)));
  r._h = [r.muni, r.no, r.name, r.label, ...ofs.map(f => f[0] + " " + f[2]), ...r._models].join("\n").toLowerCase();
  r.mods = [...r._models].sort().join(", ") + (r.dis.length ? " - DISAGREE" : "");
  r._stn = r.muni.toLowerCase() + " " + (parseInt(r.no) || 0);
  r._st = r.state + " " + r.ast;
  r._pdfs = all.some(x => x.pdf);
  return r;
}
const txt = () => DataTable.render.text();
const fmt = () => ({_: d => d, display: d => esc(when(d))});
const sel = id => $(id).value;
function keep(r) {
  if (onlyId != null && r.id !== onlyId) return false;
  const q = $("q").value.trim().toLowerCase();
  const rs = chosenRules();
  return (!q || r._h.includes(q)) && (!sel("m") || r.muni === sel("m")) && (!sel("e") || r.el === sel("e"))
    && (!sel("mod") || r._models.has(sel("mod"))) && r._sev >= +sel("sev")
    && (!rs.length || rs.some(x => r._rules.has(x))) && (!$("fl").checked || r._fl)
    && (!$("rp").checked || r.state === "replaced") && (!$("rm").checked || r.state === "removed")
    && (!$("fa").checked || r.ast === "failed") && (!$("loc").checked || r._pdfs) && (!$("dis").checked || r.dis.length);
}
function initTable() {
  DataTable.ext.search.push((s, _d, _i, row) => s.nTable.id !== "forms" || keep(row));
  table = new DataTable("#forms", {
    data: rows, deferRender: true, pageLength: 100, lengthMenu: [50, 100, 250, 500],
    order: [[6, "desc"], [4, "desc"]], stateSave: true, stateDuration: 0,
    layout: {topStart: "pageLength", topEnd: null, bottomStart: "info", bottomEnd: "paging"},
    stateSaveParams: (s, d) => { d.rg = readCtl(); },
    stateLoadParams: (s, d) => { if (!location.hash.slice(1) && d.rg) setCtl(d.rg); },
    columns: [
      {data: null, orderable: false, className: "dt-control", defaultContent: "",
       createdCell: (td, d, r) => { if (!r.v.length && !r.ops.length) td.classList.remove("dt-control"); }},
      {data: "el", title: "Election", visible: false, render: {_: d => d, display: d => esc(D.elections[d] || d)}},
      {data: "_stn", title: "Station", className: "scol", render: {_: d => d, display: (d, t, r) => esc(r.muni) + "<br>" +
        esc((r.no ? "BM " + r.no : "") + (r.no && r.name ? " - " : "") + (r.name || ""))}},
      {data: "label", title: "Document", render: txt(), defaultContent: ""},
      {data: "up", title: "Times (RS)", className: "nw", render: {_: d => d || "", display: (d, t, r) =>
        esc((d ? "up " + when(d) : "") ) + (d ? "<br>" : "") + esc("seen " + when(r.seen))}},
      {data: "_st", title: "Status", className: "nw", render: {_: d => d, display: (d, t, r) =>
        esc(r.state) + "<br>" + esc("analysis " + r.ast)}},
      {data: "sev", title: "Findings", render: {_: d => d, display: () => ""}, className: "fcol",
       createdCell: (td, d, r) => { td.append(badges(r.f)); if (r._note) td.append(mk("span", r._note, "note")); }},
      {data: "mods", title: "Models", className: "nw", render: txt(), createdCell: (td, d, r) => { if (r.dis.length) td.classList.add("disagree"); }},
      {data: "pdf", title: "Local PDF", className: "nw", render: {_: d => d ? 1 : 0, display: () => ""},
       createdCell: (td, d, r) => { const h = localHref(r.pdf); if (h) td.append(link("Local PDF", h)); }},
      {data: "rik", title: "RIK", className: "nw", render: {_: d => d ? 1 : 0, display: () => ""},
       createdCell: (td, d, r) => { const h = rikHref(r.rik); if (h) td.append(link("RIK", h)); }}]
  });
  const box = $("cols");  // column visibility toggles (saved with the table state)
  table.columns().every(function (i) {
    if (!i) return;
    const l = mk("label"), c = document.createElement("input");
    c.type = "checkbox"; c.checked = this.visible();
    c.addEventListener("input", () => table.column(i).visible(c.checked));
    l.append(c, " " + this.header().textContent);
    box.append(l);
  });
  $("forms").addEventListener("click", ev => {
    const td = ev.target.closest("td.dt-control");
    if (!td) return;
    const row = table.row(td.parentElement);
    row.child.isShown() ? row.child.hide() : row.child(child(row.data())).show();
  });
}
function optsOf(sel2, first, items) {
  const keepv = sel2.value;
  sel2.replaceChildren(new Option(first, ""));
  for (const [v, t] of items) sel2.append(new Option(t, v));
  sel2.value = [...sel2.options].some(o => o.value === keepv) ? keepv : "";
}
function applyData(data) {
  D = data;
  rows = D.rows.map(prep);
  optsOf($("m"), "all municipalities", [...new Set(rows.map(r => r.muni))].sort().map(m => [m, m]));
  const parents = [...new Set(rows.map(r => r.el))].sort();
  optsOf($("e"), "all elections", parents.map(p => [p, D.elections[p] || p]));
  $("e").hidden = parents.length < 2;
  optsOf($("mod"), "all models", [...new Set(rows.flatMap(r => [...r._models]))].sort().map(m => [m, m]));
  $("mod").hidden = $("mod").options.length < 2;
  $("dis").parentElement.hidden = $("mod").hidden;
  const chosen = new Set(chosenRules());
  $("rules").replaceChildren(...[...new Set(rows.flatMap(r => [...r._rules]))].sort().map(r => {
    const l = mk("label"), c = document.createElement("input");
    c.type = "checkbox"; c.value = r; c.checked = chosen.has(r);
    l.append(c, " " + r);
    return l; }));
  $("rulesbox").hidden = !$("rules").children.length;
  rulesSummary();
  T = D.tally;
  renderTally();
  $("built").textContent = "built " + epoch(Date.parse(D.built) / 1000);
  if (!table) { readHash(); initTable(); return; }
  const shown = new Set();
  table.rows().every(function () { if (this.child.isShown()) shown.add(this.data().id); });
  table.clear().rows.add(rows).draw(false);
  table.rows().every(function () { if (shown.has(this.data().id)) this.child(child(this.data())).show(); });
}

// ---- results (unofficial tally) -----------------------------------------------------------
const nf = new Intl.NumberFormat("en-GB");
const num = v => v == null ? "-" : nf.format(v);
const pc = x => x == null ? "-" : (x * 100).toFixed(1) + "%";
const ratio = (a, b) => b ? a / b : null;
function resultCols(mode) {  // [title, raw value, display, csv cell]
  const t = r => r[mode], c = [
    ["Municipality", r => r.m, s => s, r => r.m],
    ["Stations", r => r.stations, num], ["Counted", r => r.counted, num], ["Clean", r => r.clean, num],
    ["Excluded", r => r.excluded, num],
    ["Coverage", r => ratio(r.counted, r.stations), pc, r => ratio(r.counted, r.stations) == null ? "" : (100 * r.counted / r.stations).toFixed(1)],
    ["Registered", r => t(r).registered, num], ["Voted", r => t(r).voted, num],
    ["Turnout", r => t(r).turnout, pc, r => t(r).turnout == null ? "" : (100 * t(r).turnout).toFixed(1)],
    ["In box", r => t(r).ballots_in_box, num], ["Invalid", r => t(r).invalid, num],
    ["Valid", r => t(r).valid, num], ["Outside", r => t(r).outside_voted, num]];
  T.names.forEach((n, i) => {
    c.push([n + " votes", r => t(r).lists[i], num]);
    c.push([n + " %", r => ratio(t(r).lists[i], t(r).lists_valid), pc, r => ratio(t(r).lists[i], t(r).lists_valid) == null ? "" : (100 * t(r).lists[i] / t(r).lists_valid).toFixed(1)]);
  });
  return c.map(x => ({t: x[0], v: x[1], f: x[2], c: x[3] || x[1]}));
}
function csvCell(x) {  // text starting with = + - @ would run as a spreadsheet formula
  if (x == null) return "";
  if (typeof x === "number") return String(x);
  x = String(x);
  if (/^[=+\-@\t\r]/.test(x)) x = "'" + x;
  return /[",\n\r]/.test(x) ? '"' + x.replace(/"/g, '""') + '"' : x;
}
function tallyCsv() {
  const cols = resultCols($("tmode").value), rows = [...T.munis, T.overall];
  // header is row 1 (pandas/Excel read it cleanly); the unofficial note is a last column, first data row
  const note = "Unofficial - numbers read by " + T.model + " from the scanned forms; " +
    ($("tmode").value === "cl" ? "clean forms only" : "all counted forms");
  const head = [...cols.map(c => csvCell(c.t)), "Note"].join(",");
  const lines = rows.map((r, i) => [...cols.map(c => csvCell(c.c(r))), i ? "" : csvCell(note)].join(","));
  return [head, ...lines].join("\r\n") + "\r\n";
}
function showForm(id, label) {
  onlyId = id;
  setCtl({});  // other form filters would hide it
  writeHash();
  $("onlytxt").textContent = "showing only: " + label + " (other filters cleared)";
  $("onlyid").hidden = false;
  setHero(false);
  setTab("forms");
  redraw();
}
let tkey = "", tcols = "";
function renderTally() {
  $("hmode").value = $("tmode").value;
  $("tabres").hidden = !T;
  if (!T) {  // no tally any more: leave the results views
    if (!$("resview").hidden || document.body.classList.contains("hero")) { setHero(false); setTab("forms"); }
    renderHero();
    return;
  }
  $("tmeta").textContent = "Model: " + T.model + ". " + T.title + ". Repeat-vote forms are not included.";
  renderHero();
  const key = $("tmode").value + JSON.stringify(T);
  if (key === tkey) return;  // unchanged: keep the tables (search, sort, page) as they are
  tkey = key;
  const none = !T.munis.length, cols = resultCols($("tmode").value), ov = $("toverall");
  const tbl = mk("table"), hr = mk("tr"), dr = mk("tr");
  for (const c of cols) { hr.append(mk("th", c.t)); dr.append(mk("td", c.f(c.v(T.overall)))); }
  tbl.append(hr, dr);
  ov.replaceChildren(none ? mk("p", "no analysed forms yet", "mut") : tbl);
  const sig = $("tmode").value + "\n" + T.names.join("\n");
  if (tmTable && sig === tcols) {
    tmTable.clear().rows.add(T.munis).draw(false);
  } else {
    tcols = sig;
    if (tmTable) { tmTable.destroy(); $("tmunis").replaceChildren(); }
    tmTable = new DataTable("#tmunis", {
      data: T.munis, paging: false, order: [[0, "asc"]], layout: {topStart: "search", topEnd: null, bottomStart: "info"},
      columns: cols.map((c, i) => ({title: esc(c.t), type: i ? "num" : "string", className: i ? "dt-right" : "",
        render: {_: (d, t, r) => { const v = c.v(r); return v == null ? -1 : v; }, display: (d, t, r) => esc(c.f(c.v(r)))}}))});
  }
  if (teTable) {
    teTable.clear().rows.add(T.excluded).draw(false);
  } else {
    teTable = new DataTable("#texcl", {
      data: T.excluded, pageLength: 50, layout: {topStart: "search", topEnd: null, bottomStart: "info", bottomEnd: "paging"},
      columns: [{data: "m", title: "Municipality", render: DataTable.render.text()},
        {data: "no", title: "BM", render: DataTable.render.text(), defaultContent: "", className: "dt-left"},
        {data: "why", title: "Why excluded", render: {_: d => d.join("; "), display: d => esc(d.join("; "))}},
        {data: null, title: "", orderable: false, defaultContent: "", createdCell: (td, d, r) => {
          const b = mk("button", "show form"); b.onclick = () => showForm(r.id, r.m + " BM " + r.no); td.append(b); }}]});
  }
  $("tnotes").replaceChildren(...T.notes.map(n => mk("li", n.m + " BM " + n.no + ": " + n.note)));
  $("tnoteshead").hidden = !T.notes.length;
}

// ---- hero display -------------------------------------------------------------------------
const OKABE = ["#E69F00", "#56B4E9", "#009E73", "#F0E442", "#0072B2", "#D55E00", "#CC79A7", "#999999"];
const TOP_LISTS = 8;
let heroMuni = "", slots = [];
function put(id, text) {  // set text; flash when it changed
  const el = $(id);
  if (el.textContent === text) return;
  const first = !el.textContent || el.textContent === "-";
  el.textContent = text;
  if (first) return;
  el.classList.remove("flash");
  void el.offsetWidth;
  el.classList.add("flash");
}
function initHero() {
  for (let i = 0; i <= TOP_LISTS; i++) {
    const row = mk("div", null, "hrow"), nm = mk("div", null, "nm"), tr = mk("div", null, "track"),
      fill = mk("div", null, "fill"), val = mk("div", null, "val");
    tr.append(fill);
    row.append(nm, tr, val);
    row.hidden = true;
    $("herochart").append(row);
    slots.push({row, nm, fill, val});
  }
}
function heroMunis() {
  const sel = $("hmuni"), names = T ? T.munis.map(m => m.m) : [];
  if ([...sel.options].slice(1).map(o => o.value).join("\n") === names.join("\n") && sel.options.length) return;
  sel.replaceChildren(new Option("All municipalities", ""), ...names.map(n => new Option(n, n)));
  if (!names.includes(heroMuni)) heroMuni = "";
  sel.value = heroMuni;
}
function renderHero() {
  heroMunis();
  const foot = $("herofoot");
  const stale = S && (!S.watching || Date.now() / 1000 - S.ts > STALE_S);
  const label = T ? "UNOFFICIAL - numbers read by " + T.model + " from the scanned forms, not RIK results. " +
    ($("tmode").value === "cl" ? "Clean forms only. " : "All counted forms. ") +
    "As of " + epoch(Date.parse(D.built) / 1000).slice(-5) + " (Serbian time)." : "UNOFFICIAL - no results yet.";
  foot.replaceChildren(label, ...(stale ? [mk("span", " Watcher not running: numbers may be out of date.", "stale")] : []));
  $("heronames").hidden = !(T && T.names_note);
  if (T && T.names_note) $("heronames").textContent = T.names_note;
  if (!T) { $("herotitle").textContent = ""; $("heronote").textContent = "No analysed forms yet."; for (const s of slots) s.row.hidden = true; return; }
  const r = (heroMuni && T.munis.find(m => m.m === heroMuni)) || T.overall, t = r[$("tmode").value], none = !r.counted;
  const cover = r.stations ? r.counted / r.stations : null;
  put("herotitle", (r === T.overall ? "All municipalities" : r.m) + " - " + T.title);
  put("hv-turn", none ? "-" : pc(t.turnout));
  put("hs-turn", none ? "" : num(t.voted) + " of " + num(t.registered) + " registered");
  put("hv-st", num(r.counted) + (r.stations ? " / " + num(r.stations) : ""));
  put("hs-st", cover == null ? "stations known: unknown" : pc(cover) + " of stations");
  $("hp-st").style.width = (cover == null ? 0 : Math.min(100, cover * 100)) + "%";
  put("hv-forms", num(r.clean) + " / " + num(r.excluded));
  put("hv-valid", none ? "-" : num(t.valid));
  put("hs-valid", none || !t.registered ? "" : "valid votes counted");
  $("heronote").textContent = none ? "No forms counted yet - no results to show."
    : cover != null && cover < 0.1 ? "Very early - few stations counted. Do not read these shares as a result." : "";
  const rows = none || !t.lists_valid ? [] : T.names.map((n, i) => ({n, i, v: t.lists[i]}))
    .sort((a, b) => b.v - a.v || a.i - b.i);
  const shown = rows.slice(0, TOP_LISTS), rest = rows.slice(TOP_LISTS);
  if (rest.length) shown.push({n: "Others (" + rest.length + " lists)", i: -1, v: rest.reduce((a, x) => a + x.v, 0)});
  slots.forEach((s, k) => {
    const e = shown[k];
    s.row.hidden = !e;
    if (!e) return;
    const share = e.v / t.lists_valid;
    s.nm.textContent = e.n; s.nm.title = e.n;
    s.val.textContent = num(e.v) + "  " + pc(share);
    s.fill.style.width = Math.min(100, share * 100) + "%";
    s.fill.style.backgroundColor = e.i < 0 ? "#777" : OKABE[e.i % (OKABE.length - 1)];
  });
}
function setHero(on) {
  document.body.classList.toggle("hero", on);
  $("herobtn").textContent = on ? "Exit (Esc)" : "Presentation mode";
  if (on) setTab("results");
}
$("herobtn").onclick = () => setHero(!document.body.classList.contains("hero"));
document.addEventListener("keydown", ev => { if (ev.key === "Escape") setHero(false); });
$("hmuni").addEventListener("input", () => { heroMuni = $("hmuni").value; if (T) renderHero(); });
$("hmode").addEventListener("input", () => { $("tmode").value = $("hmode").value; if (T) renderTally(); });
initHero();
if (new URLSearchParams(location.search).get("hero") === "1") setHero(true);

function setTab(name) {
  const res = name === "results";
  $("formsview").hidden = res; $("resview").hidden = !res;
  $("tabforms").classList.toggle("on", !res); $("tabres").classList.toggle("on", res);
  if (res && tmTable) { tmTable.columns.adjust(); teTable.columns.adjust(); }
}
$("tabforms").onclick = () => setTab("forms");
$("tabres").onclick = () => setTab("results");
$("tmode").addEventListener("input", () => { if (T) renderTally(); });
$("onlyclear").onclick = () => { onlyId = null; $("onlyid").hidden = true; redraw(); };
$("csv").onclick = () => {
  if (!T) return;
  const a = mk("a");
  a.href = URL.createObjectURL(new Blob(["\ufeff" + tallyCsv()], {type: "text/csv;charset=utf-8"}));
  a.download = "rg2-unofficial-tally-" + String(T.parent).replace(/[^\w.-]+/g, "_") + ".csv";
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};

// ---- filter state: URL hash first, saved state second; absent keys reset to defaults -------
const chosenRules = () => [...$("rules").querySelectorAll("input:checked")].map(c => c.value);
function rulesSummary() {
  const n = chosenRules();
  $("rulessum").textContent = "rules: " + (n.length ? n.length > 2 ? n.length + " selected" : n.join(", ") : "any");
}
function readCtl() {
  const o = {};
  for (const k of FILTERS) o[k] = $(k).type === "checkbox" ? $(k).checked : $(k).value;
  o.rules = chosenRules();
  return o;
}
function setCtl(o) {
  for (const k of FILTERS) {
    const v = o[k], el = $(k);
    if (el.type === "checkbox") el.checked = k === "auto" ? v !== false : v === true;
    else {
      el.value = v == null ? "" : v;
      if (el.value !== String(v)) el.value = k === "sev" ? "0" : "";
    }
  }
  for (const c of $("rules").querySelectorAll("input")) c.checked = (o.rules || []).includes(c.value);
  rulesSummary();
}
function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  const o = {rules: (p.get("rules") || "").split(",")};
  for (const k of FILTERS) o[k] = $(k).type === "checkbox" ? (k === "auto" ? p.get(k) !== "0" : p.get(k) === "1") : p.get(k);
  setCtl(o);
}
function writeHash() {
  const c = readCtl(), p = new URLSearchParams();
  for (const k of FILTERS) {
    if (k === "auto") { if (!c.auto) p.set("auto", "0"); }
    else if (typeof c[k] === "boolean") { if (c[k]) p.set(k, "1"); }
    else if (c[k] && c[k] !== "0") p.set(k, c[k]);
  }
  if (c.rules.length) p.set("rules", c.rules.join(","));
  try { history.replaceState(null, "", "#" + p); } catch (e) {}
}
function redraw() { writeHash(); if (table) table.draw(); }
let timer = 0;
$("q").addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(redraw, 200); });
for (const id of FILTERS) if (id !== "q") $(id).addEventListener("input", redraw);
$("rules").addEventListener("input", () => { rulesSummary(); redraw(); });
window.addEventListener("hashchange", () => { readHash(); if (table) table.draw(); });

// ---- loading: fetch() over http, script re-injection from file:// ------------------------
function inject(name, done) {
  const s = document.createElement("script");
  s.src = name + ".js?t=" + Date.now();
  s.onload = () => { s.remove(); done(); };
  s.onerror = () => { s.remove(); console.error("loading " + name + ".js failed"); };
  document.head.append(s);
}
function load(name, global, apply) {
  const run = d => { try { apply(d); } catch (e) { console.error("applying " + name + " failed", e); } };
  if (HTTP) {
    fetch(name + ".json?t=" + Date.now(), {cache: "no-store"})
      .then(r => r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status)))
      .then(run, e => console.error("fetching " + name + ".json failed", e));
  } else inject(name, () => run(window[global]));
}
function loadStatus() { load("status", "RG2_STATUS", s => { S = s; renderStatus(); }); }
let dataBuilt = null;
function loadData() {
  load("data", "RG2_DATA", d => { if (d && d.built !== dataBuilt) { applyData(d); dataBuilt = d.built; } });
}
loadStatus();
setInterval(loadStatus, STATUS_EVERY_MS);
setInterval(renderStatus, 5000);
// first load always; later loads only while auto-refresh is on, at the period given by the data (0 = off)
loadData();
function loop() {
  if (!table || ($("auto").checked && D.interval > 0)) loadData();
  setTimeout(loop, Math.max(5, D.interval || 10) * 1000);
}
setTimeout(loop, 10000);
