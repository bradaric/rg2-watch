<!doctype html>
<html lang="sr-Cyrl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Незванични резултати</title>
<style>
:root{color-scheme:light dark;--bg:#f4f6f8;--panel:#fff;--fg:#17202a;--mut:#637083;--line:#ccd3db;--accent:#0072b2;--good:#00805d;--warn:#ad6500;--bar:#56b4e9}
@media(prefers-color-scheme:dark){:root{--bg:#10151b;--panel:#171e26;--fg:#e8edf2;--mut:#a9b3bf;--line:#3a4653;--accent:#56b4e9;--good:#57c99c;--warn:#f0b35c;--bar:#56b4e9}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,sans-serif}main{max-width:1180px;margin:auto;padding:24px}header{display:flex;gap:18px;align-items:end;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:16px}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-weight:800;color:var(--mut);font-size:.78rem}h1{font-size:clamp(1.45rem,3vw,2.5rem);margin:.2rem 0}label{font-weight:700}select{display:block;margin-top:5px;min-width:15rem;max-width:100%;padding:9px 34px 9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg);font:inherit}.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;background:var(--panel);margin:22px 0}.tile{padding:18px;min-width:0}.tile+.tile{border-left:1px solid var(--line)}.k{color:var(--mut);font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:.78rem}.v{font-size:clamp(2rem,5vw,4rem);font-weight:800;line-height:1.05;margin:.35rem 0}.of{font-size:.55em;color:var(--mut)}.s{white-space:pre-line;color:var(--mut)}.chart{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}.chart h2{margin:0 0 15px}.row{display:grid;grid-template-columns:minmax(8rem,1fr) minmax(8rem,2fr) auto;gap:12px;align-items:center;margin:10px 0}.track{height:13px;background:var(--bg);border-radius:10px;overflow:hidden}.fill{height:100%;background:var(--bar);border-radius:10px}.value{font-variant-numeric:tabular-nums;text-align:right}.note{margin:18px 0;color:var(--mut)}footer{margin-top:20px;padding-top:15px;border-top:1px solid var(--line);color:var(--mut);font-size:.9rem}.warn{color:var(--warn)}
@media(max-width:780px){main{padding:14px}.tiles{grid-template-columns:1fr 1fr}.tile:nth-child(3){border-left:0;border-top:1px solid var(--line)}.tile:nth-child(4){border-top:1px solid var(--line)}header{align-items:start;flex-direction:column}.row{grid-template-columns:1fr auto}.track{grid-column:1/-1;grid-row:2}}
@media(max-width:460px){.tiles{grid-template-columns:1fr}.tile+.tile{border-left:0;border-top:1px solid var(--line)}}
</style></head><body><main>
<header><div><div class="eyebrow">Незванични резултати</div><h1 id="title"></h1><div id="stamp" class="note"></div></div><label>Општина<select id="municipality"></select></label></header>
<section class="tiles" aria-label="Сажетак резултата">
<div class="tile"><div class="k">Излазност</div><div class="v" id="turnout">–</div><div class="s" id="turnout-sub"></div></div>
<div class="tile"><div class="k">Обрађена бирачка места</div><div class="v"><span id="stations">–</span><span class="of" id="stations-total"></span></div><div class="s" id="stations-sub"></div></div>
<div class="tile"><div class="k">Записници</div><div class="v"><span id="forms">–</span><span class="of" id="forms-total"></span></div><div class="s" id="forms-sub"></div></div>
<div class="tile"><div class="k">Важећи гласови</div><div class="v" id="valid">–</div><div class="s" id="valid-sub"></div></div>
</section>
<section class="chart"><h2>Резултати по листама</h2><div id="chart"></div><p id="chart-note" class="note"></p></section>
<p id="warning" class="note warn"></p>
<footer id="footer"></footer>
</main>
<script>const DATA=__RG2_PUBLIC_DATA__;
const $=id=>document.getElementById(id),nf=new Intl.NumberFormat("sr-Latn-RS");
const num=v=>v==null?"–":nf.format(v),pct=v=>v==null?"–":new Intl.NumberFormat("sr-Latn-RS",{style:"percent",minimumFractionDigits:1,maximumFractionDigits:1}).format(v);
const signed=v=>v>0?"+"+num(v):v<0?"−"+num(-v):"0";
function namesFor(row){const names=(DATA.scope==="municipal"?row.names:DATA.names)||[],fallback=new Set((DATA.scope==="municipal"?row.fallback_name_indices:DATA.fallback_name_indices)||[]);return names.map((x,i)=>fallback.has(i)?"Листа "+(i+1):x)}
function reviewLine(row){const r=row.review,parts=[num(r.ok)+" прихваћено"];if(r.escalate)parts.push(num(r.escalate)+" ескалирано");if(r.unsure)parts.push(num(r.unsure)+" несигурно");if(r.undecided)parts.push(num(r.undecided)+" без одлуке");return num(row.flagged)+" за проверу: "+parts.join(" · ")}
function listWord(n){const n100=n%100,n10=n100%10;return n100>=11&&n100<=14?"листа":n10>=2&&n10<=4?"листе":"листа"}
function warningText(note){const exact={"unknown election type - set tally_scope":"Непозната врста избора — подесите tally_scope","municipality unknown - forms may be from different ballots, no list totals":"Општина није позната — записници могу бити са различитих гласачких листића, без збирова по листама","no expected ballot rows - comparable list totals unavailable":"Нема очекиваних редова на гласачком листићу — упоредиви збирови по листама нису доступни","list_names must be a plain list for a national election":"list_names мора бити обична листа за републичке изборе","list_names must map municipality -> names for a municipal election":"list_names мора да пресликава општину у називе за локалне изборе"};return String(note).split("; ").map(x=>exact[x]||x).join("; ")}
function render(){const chosen=$("municipality").value,row=chosen?DATA.municipalities.find(x=>x.m===chosen):DATA.overall,t=row.totals,names=namesFor(row);$("turnout").textContent=pct(t.turnout);$("turnout-sub").textContent=num(t.voted)+" од "+num(t.registered)+" уписаних";$("stations").textContent=num(row.counted);$("stations-total").textContent=row.stations?" / "+num(row.stations):"";$("stations-sub").textContent=row.stations?pct(row.counted/row.stations)+" бирачких места":"број бирачких места није познат";$("forms").textContent=num(t.vote_forms);$("forms-total").textContent=" / "+num(row.counted);const fs=[num(row.clean)+" без уочених проблема",reviewLine(row)];if(row.counted>t.vote_forms)fs.push("Није урачунато: "+num(row.counted-t.vote_forms)+" записника");$("forms-sub").textContent=fs.join("\n");$("valid").textContent=num(t.valid);const gap=t.voted-t.valid-t.invalid;$("valid-sub").textContent="Неважећи: "+num(t.invalid)+(gap?"\nНеусаглашено: "+signed(gap):"");const chart=$("chart");chart.replaceChildren();const unavailable=!t.lists||!names.length||(DATA.scope==="municipal"&&!chosen);$("chart-note").textContent=unavailable?"Изаберите општину за упоредиве резултате по листама.":"";if(!unavailable){let rows=names.map((name,i)=>({name,value:t.lists[i]||0})).sort((a,b)=>b.value-a.value);if(rows.length>8){const rest=rows.slice(8);rows=rows.slice(0,8);rows.push({name:"Остале ("+rest.length+" "+listWord(rest.length)+")",value:rest.reduce((sum,x)=>sum+x.value,0)})}const max=Math.max(1,...rows.map(x=>x.value));for(const x of rows){const el=document.createElement("div"),name=document.createElement("div"),track=document.createElement("div"),fill=document.createElement("div"),value=document.createElement("div");el.className="row";name.textContent=x.name;track.className="track";fill.className="fill";fill.style.width=(x.value/max*100)+"%";track.append(fill);value.className="value";value.textContent=num(x.value)+(t.lists_valid?" · "+pct(x.value/t.lists_valid):"");el.append(name,track,value);chart.append(el)}}const note=[DATA.scope_note,DATA.scope==="municipal"?row.names_note:DATA.names_note].filter(Boolean);$("warning").textContent=note.length?"Напомена: "+note.map(warningText).join(". "):""}
const select=$("municipality");select.append(new Option("Све општине",""));for(const row of DATA.municipalities)select.append(new Option(row.generated_unknown_muni?"Непозната општина":row.m,row.m));select.addEventListener("change",render);$("title").textContent=DATA.title;const built=new Date(DATA.built);$("stamp").textContent="Стање у "+built.toLocaleString("sr-RS",{timeZone:"Europe/Belgrade",dateStyle:"medium",timeStyle:"short"});$("footer").textContent="НЕЗВАНИЧНО — Скенирани записници обрађени помоћу вештачке интелигенције; ово нису резултати РИК-а. Приказ је статичан снимак и не ажурира се аутоматски.";render();</script></body></html>
